<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="system-ui,-apple-system,sans-serif">
  <rect width="1200" height="760" fill="#07080c"/>

  <text x="40" y="44" fill="#eceef2" font-size="20" font-weight="700">MOCKUP 1 — The trial floor</text>
  <text x="40" y="66" fill="#7c88a8" font-size="12.5">Spatial opposition replaces the two-column dashboard. Prosecution above, defense below, the claim in the dock between them.</text>

  <!-- top status strip -->
  <line x1="40" y1="88" x2="1160" y2="88" stroke="#1e232d"/>
  <text x="40" y="110" fill="#7c88a8" font-size="11" letter-spacing="2">TRIBUNAL</text>
  <circle cx="118" cy="106" r="3.5" fill="#2be6a6"/>
  <text x="1160" y="110" fill="#7c88a8" font-size="11" letter-spacing="1.5" text-anchor="end">CLAIM 2 OF 3 · 6 AGENTS SITTING</text>

  <!-- ── PROSECUTION BENCH (top) ── -->
  <text x="40" y="150" fill="#ff5a5f" font-size="11" font-weight="700" letter-spacing="2.5">PROSECUTION</text>
  <line x1="150" y1="146" x2="1160" y2="146" stroke="#ff5a5f" stroke-opacity="0.25"/>

  <g>
    <rect x="40" y="164" width="262" height="96" rx="3" fill="#14161f" stroke="#ff5a5f" stroke-opacity="0.55"/>
    <rect x="40" y="164" width="3" height="96" fill="#ff5a5f"/>
    <text x="58" y="186" fill="#ff5a5f" font-size="9.5" font-weight="700" letter-spacing="1.8">SOURCE QUALITY</text>
    <text x="58" y="208" fill="#dfe6f5" font-size="11.5">No 2019 Stanford study with this</text>
    <text x="58" y="224" fill="#dfe6f5" font-size="11.5">finding exists in the index.</text>
    <rect x="58" y="238" width="140" height="3" rx="1.5" fill="#2a2f3d"/>
    <rect x="58" y="238" width="134" height="3" rx="1.5" fill="#ff5a5f"/>
    <text x="208" y="242" fill="#7c88a8" font-size="9">0.96</text>
  </g>

  <g>
    <rect x="326" y="164" width="262" height="96" rx="3" fill="#14161f" stroke="#ff5a5f" stroke-opacity="0.55"/>
    <rect x="326" y="164" width="3" height="96" fill="#ff5a5f"/>
    <text x="344" y="186" fill="#ff5a5f" font-size="9.5" font-weight="700" letter-spacing="1.8">ENTITY CONFLATION</text>
    <text x="344" y="208" fill="#dfe6f5" font-size="11.5">Echoes Bloom's 2015 Ctrip study,</text>
    <text x="344" y="224" fill="#dfe6f5" font-size="11.5">which found 13% — not 43%.</text>
    <rect x="344" y="238" width="140" height="3" rx="1.5" fill="#2a2f3d"/>
    <rect x="344" y="238" width="129" height="3" rx="1.5" fill="#ff5a5f"/>
    <text x="494" y="242" fill="#7c88a8" font-size="9">0.92</text>
  </g>

  <g opacity="0.55">
    <rect x="612" y="164" width="262" height="96" rx="3" fill="#14161f" stroke="#2a2f3d"/>
    <rect x="612" y="164" width="3" height="96" fill="#4a5163"/>
    <text x="630" y="186" fill="#7c88a8" font-size="9.5" font-weight="700" letter-spacing="1.8">TEMPORAL STALENESS</text>
    <text x="630" y="208" fill="#7c88a8" font-size="11.5">No source confirms a 2019</text>
    <text x="630" y="224" fill="#7c88a8" font-size="11.5">publication date.</text>
    <rect x="630" y="238" width="140" height="3" rx="1.5" fill="#2a2f3d"/>
    <rect x="630" y="238" width="112" height="3" rx="1.5" fill="#8a5560"/>
    <text x="780" y="242" fill="#7c88a8" font-size="9">0.80</text>
  </g>

  <g>
    <rect x="898" y="164" width="262" height="96" rx="3" fill="#0f1118" stroke="#2a2f3d" stroke-dasharray="3 3"/>
    <text x="916" y="186" fill="#4a5163" font-size="9.5" font-weight="700" letter-spacing="1.8">LOGICAL LEAP</text>
    <text x="916" y="212" fill="#4a5163" font-size="11.5">deliberating</text>
    <circle cx="1000" cy="208" r="2.5" fill="#4a5163"/>
    <circle cx="1010" cy="208" r="2.5" fill="#4a5163" opacity="0.6"/>
    <circle cx="1020" cy="208" r="2.5" fill="#4a5163" opacity="0.3"/>
    <text x="916" y="242" fill="#3fe0ff" font-size="9" letter-spacing="1">STILL ARGUING</text>
  </g>

  <!-- strike beams converging on the dock -->
  <path d="M171 264 L560 330" stroke="#ff5a5f" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M457 264 L575 330" stroke="#ff5a5f" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M743 264 L625 330" stroke="#ff5a5f" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="560" cy="330" r="3" fill="#ff5a5f"/>
  <circle cx="575" cy="330" r="3" fill="#ff5a5f"/>

  <!-- ── THE DOCK (centre) ── -->
  <rect x="230" y="338" width="740" height="118" rx="4" fill="#10131c" stroke="#3a4256"/>
  <text x="252" y="366" fill="#7c88a8" font-size="9.5" letter-spacing="2.5">CLAIM UNDER TRIAL · IN THE DOCK</text>
  <text x="252" y="398" fill="#ffffff" font-size="19" font-style="italic" font-family="Georgia,serif">“A 2019 Stanford study found that remote</text>
  <text x="252" y="424" fill="#ffffff" font-size="19" font-style="italic" font-family="Georgia,serif">workers are 43% more productive.”</text>

  <!-- integrity meter: the claim taking damage -->
  <text x="800" y="366" fill="#7c88a8" font-size="9" letter-spacing="1.5">INTEGRITY</text>
  <rect x="800" y="376" width="146" height="6" rx="3" fill="#2a2f3d"/>
  <rect x="800" y="376" width="31" height="6" rx="3" fill="#ff5a5f"/>
  <text x="800" y="400" fill="#ff5a5f" font-size="11" font-weight="700">21%</text>
  <text x="836" y="400" fill="#7c88a8" font-size="10">— under sustained attack</text>
  <text x="800" y="428" fill="#4a5163" font-size="9.5">3 strikes landed · 1 pending</text>

  <!-- cracks across the claim -->
  <path d="M300 405 l14 -13 l6 15 l16 -10" stroke="#ff5a5f" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
  <path d="M520 384 l11 14 l9 -9 l13 12" stroke="#ff5a5f" stroke-opacity="0.3" stroke-width="1.2" fill="none"/>

  <!-- ── DEFENSE BENCH (bottom) ── -->
  <path d="M600 534 L600 462" stroke="#1fc16b" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="40" y="510" fill="#1fc16b" font-size="11" font-weight="700" letter-spacing="2.5">DEFENSE</text>
  <line x1="120" y1="506" x2="1160" y2="506" stroke="#1fc16b" stroke-opacity="0.25"/>

  <g>
    <rect x="326" y="524" width="548" height="80" rx="3" fill="#111a16" stroke="#1fc16b" stroke-opacity="0.4"/>
    <rect x="326" y="524" width="3" height="80" fill="#1fc16b"/>
    <text x="344" y="546" fill="#1fc16b" font-size="9.5" font-weight="700" letter-spacing="1.8">STRONGEST HONEST CASE</text>
    <text x="344" y="568" fill="#dfe6f5" font-size="11.5">Stanford has published remote-work research — but none matching this</text>
    <text x="344" y="584" fill="#dfe6f5" font-size="11.5">year, figure, or framing. The defense is weak.</text>
    <rect x="700" y="592" width="140" height="3" rx="1.5" fill="#2a2f3d"/>
    <rect x="700" y="592" width="20" height="3" rx="1.5" fill="#1fc16b"/>
    <text x="850" y="596" fill="#7c88a8" font-size="9">0.14</text>
  </g>

  <!-- ── evidence rail ── -->
  <line x1="40" y1="638" x2="1160" y2="638" stroke="#1e232d"/>
  <text x="40" y="662" fill="#7c88a8" font-size="9.5" letter-spacing="2">EVIDENCE ON THE RECORD</text>
  <g font-size="10.5">
    <rect x="40" y="676" width="188" height="30" rx="3" fill="#14161f" stroke="#ff5a5f" stroke-opacity="0.45"/>
    <circle cx="56" cy="691" r="3" fill="#ff5a5f"/>
    <text x="68" y="695" fill="#dfe6f5">gsb.stanford.edu</text>
    <rect x="238" y="676" width="188" height="30" rx="3" fill="#14161f" stroke="#ff5a5f" stroke-opacity="0.45"/>
    <circle cx="254" cy="691" r="3" fill="#ff5a5f"/>
    <text x="266" y="695" fill="#dfe6f5">nbloom.people.stanford.edu</text>
    <rect x="436" y="676" width="160" height="30" rx="3" fill="#14161f" stroke="#2a2f3d"/>
    <circle cx="452" cy="691" r="3" fill="#4a5163"/>
    <text x="464" y="695" fill="#7c88a8">apollotechnical.com</text>
  </g>
  <text x="1160" y="695" fill="#4a5163" font-size="10" text-anchor="end">contradicting · contradicting · neutral</text>

  <!-- annotations -->
  <g font-size="10.5" fill="#3fe0ff">
    <text x="990" y="300">▸ arguments fly IN as strikes</text>
    <text x="990" y="316" fill="#7c88a8">motion: spring, stagger 90ms</text>
    <text x="60" y="470">▸ integrity drains as strikes land</text>
    <text x="60" y="486" fill="#7c88a8">the claim visibly loses</text>
  </g>
</svg>
