<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="system-ui,-apple-system,sans-serif">
  <rect width="1200" height="720" fill="#07080c"/>

  <text x="40" y="44" fill="#eceef2" font-size="20" font-weight="700">MOCKUP 2 — The verdict lands</text>
  <text x="40" y="66" fill="#7c88a8" font-size="12.5">The one moment the whole pitch rests on. The seal does not fade in — it SLAMS, the frame shakes, the failure mode burns through.</text>

  <!-- frame -->
  <rect x="40" y="96" width="1120" height="440" rx="5" fill="#0c0e15" stroke="#ff5a5f" stroke-opacity="0.35"/>

  <!-- shake ghosts, showing the impact -->
  <rect x="43" y="99" width="1120" height="440" rx="5" fill="none" stroke="#ff5a5f" stroke-opacity="0.12"/>
  <rect x="37" y="93" width="1120" height="440" rx="5" fill="none" stroke="#ff5a5f" stroke-opacity="0.08"/>

  <!-- the claim, now struck through -->
  <text x="80" y="148" fill="#7c88a8" font-size="9.5" letter-spacing="2.5">CLAIM 2 OF 3</text>
  <text x="80" y="192" fill="#8891a6" font-size="21" font-style="italic" font-family="Georgia,serif">“A 2019 Stanford study found that remote workers</text>
  <text x="80" y="222" fill="#8891a6" font-size="21" font-style="italic" font-family="Georgia,serif">are 43% more productive.”</text>
  <line x1="80" y1="184" x2="880" y2="184" stroke="#ff5a5f" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="80" y1="214" x2="700" y2="214" stroke="#ff5a5f" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- THE SEAL -->
  <g transform="translate(980 250)">
    <circle r="104" fill="none" stroke="#ff5a5f" stroke-opacity="0.18" stroke-width="1"/>
    <circle r="92" fill="#1a0e11" stroke="#ff5a5f" stroke-width="3"/>
    <circle r="80" fill="none" stroke="#ff5a5f" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 5"/>
    <text y="-16" fill="#ff5a5f" font-size="25" font-weight="800" text-anchor="middle" letter-spacing="1.5">REFUTED</text>
    <line x1="-52" y1="-2" x2="52" y2="-2" stroke="#ff5a5f" stroke-opacity="0.5"/>
    <text y="22" fill="#ff8f92" font-size="30" font-weight="700" text-anchor="middle">91%</text>
    <text y="42" fill="#a86068" font-size="8.5" text-anchor="middle" letter-spacing="2.5">CONFIDENCE</text>
    <text y="66" fill="#7c88a8" font-size="8" text-anchor="middle" letter-spacing="1.5">TRIBUNAL · SITTING 8507</text>
    <!-- impact rings -->
    <circle r="118" fill="none" stroke="#ff5a5f" stroke-opacity="0.14"/>
    <circle r="136" fill="none" stroke="#ff5a5f" stroke-opacity="0.07"/>
  </g>

  <!-- failure mode — burns in after the seal -->
  <rect x="80" y="256" width="330" height="52" rx="3" fill="#2a0f13" stroke="#ff5a5f" stroke-width="1.5"/>
  <text x="98" y="278" fill="#ff5a5f" font-size="9" font-weight="700" letter-spacing="2">FAILURE MODE</text>
  <text x="98" y="298" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">FABRICATED CITATION</text>

  <!-- ruling -->
  <text x="80" y="348" fill="#7c88a8" font-size="9.5" letter-spacing="2">THE RULING</text>
  <text x="80" y="376" fill="#dfe6f5" font-size="13.5">No such 2019 Stanford study exists. The claim borrows Stanford's authority</text>
  <text x="80" y="398" fill="#dfe6f5" font-size="13.5">while distorting a real 2015 experiment by Nicholas Bloom, which measured</text>
  <text x="80" y="420" fill="#dfe6f5" font-size="13.5">a 13% gain. Both the year and the figure are invented.</text>

  <!-- panel tally -->
  <text x="80" y="466" fill="#7c88a8" font-size="9.5" letter-spacing="2">THE PANEL SPLIT 4–0 · DISAGREEMENT 0.09</text>
  <g>
    <rect x="80" y="478" width="88" height="6" rx="3" fill="#ff5a5f"/>
    <rect x="176" y="478" width="88" height="6" rx="3" fill="#ff5a5f"/>
    <rect x="272" y="478" width="88" height="6" rx="3" fill="#ff5a5f"/>
    <rect x="368" y="478" width="88" height="6" rx="3" fill="#ff5a5f"/>
    <rect x="464" y="478" width="88" height="6" rx="3" fill="#1fc16b" opacity="0.35"/>
  </g>
  <text x="80" y="504" fill="#4a5163" font-size="9.5">source quality · entity · temporal · logic</text>
  <text x="464" y="504" fill="#4a5163" font-size="9.5">defense</text>

  <!-- motion spec -->
  <line x1="40" y1="570" x2="1160" y2="570" stroke="#1e232d"/>
  <text x="40" y="596" fill="#3fe0ff" font-size="11" font-weight="700" letter-spacing="2">MOTION — the four beats</text>

  <g font-size="11.5">
    <text x="40" y="626" fill="#eceef2" font-weight="700">1 · WIND-UP</text>
    <text x="40" y="646" fill="#7c88a8">seal enters at scale 2.4,</text>
    <text x="40" y="662" fill="#7c88a8">opacity 0, rotated −12°</text>
    <text x="40" y="682" fill="#4a5163">120ms</text>

    <text x="320" y="626" fill="#eceef2" font-weight="700">2 · IMPACT</text>
    <text x="320" y="646" fill="#7c88a8">slams to scale 1 on a stiff</text>
    <text x="320" y="662" fill="#7c88a8">spring · frame shakes 8px</text>
    <text x="320" y="682" fill="#4a5163">stiffness 700, damping 18</text>

    <text x="600" y="626" fill="#eceef2" font-weight="700">3 · STRIKE-THROUGH</text>
    <text x="600" y="646" fill="#7c88a8">lines draw across the claim,</text>
    <text x="600" y="662" fill="#7c88a8">left to right, as it greys</text>
    <text x="600" y="682" fill="#4a5163">220ms, 60ms after impact</text>

    <text x="880" y="626" fill="#eceef2" font-weight="700">4 · BURN-IN</text>
    <text x="880" y="646" fill="#7c88a8">failure mode fades up last,</text>
    <text x="880" y="662" fill="#7c88a8">ruling staggers in beneath</text>
    <text x="880" y="682" fill="#4a5163">300ms, stagger 40ms</text>
  </g>

  <text x="40" y="712" fill="#4a5163" font-size="10.5">A SUPPORTED verdict uses the same choreography in green, with no strike-through and no failure chip — so the two outcomes feel physically different, not just recoloured.</text>
</svg>
